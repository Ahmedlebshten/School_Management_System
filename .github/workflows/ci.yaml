name: CI - Build, Test & Push to ECR

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT: 731628759499
  ECR_REPO: school-management-system
  DEPLOY_FILE: school/school-deployment.yaml
  CD_REPO: Ahmedlebshten/School_Management_System_CD

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # -------------------------
      # Setup PHP
      # -------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
          coverage: none

      # -------------------------
      # Install Dependencies
      # -------------------------
      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist

      # -------------------------
      # Validate Composer
      # -------------------------
      - name: Validate Composer
        run: composer validate

      # -------------------------
      # PHP Lint
      # -------------------------
      - name: PHP Lint
        run: |
          find . -type f -name "*.php" -exec php -l {} \;

      # -------------------------
      # Run Tests (if exist)
      # -------------------------
      - name: Run Tests
        run: |
          if [ -f vendor/bin/phpunit ]; then
            vendor/bin/phpunit
          else
            echo "No PHPUnit tests found, skipping..."
          fi

      # -------------------------
      # Generate Image Tag
      # -------------------------
      - name: Generate Image Tag
        run: echo "IMAGE_TAG=${{ github.run_number }}" >> $GITHUB_ENV

      # -------------------------
      # Configure AWS Credentials (OIDC)
      # -------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::731628759499:role/GitHubActionsECRRole
          aws-region: ${{ env.AWS_REGION }}

      # -------------------------
      # Login to ECR
      # -------------------------
      - name: Login to ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION \
          | docker login --username AWS --password-stdin $AWS_ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com

      # -------------------------
      # Build Docker Image
      # -------------------------
      - name: Build Docker Image
        run: |
          IMAGE_URI=$AWS_ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$IMAGE_TAG
          docker build -t $IMAGE_URI .
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      # -------------------------
      # Scan Docker Image (Trivy)
      # -------------------------
      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # -------------------------
      # Push Docker Image
      # -------------------------
      - name: Push Docker Image
        run: docker push $IMAGE_URI

      # -------------------------
      # Clone CD Repo
      # -------------------------
      - name: Clone CD Repo
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ env.CD_REPO }} cd-repo

      # -------------------------
      # Update CD Repo (bump image tag)
      # -------------------------
      - name: Update CD Repo
        run: |
          cd cd-repo
          sed -i "s|image: .*|image: $IMAGE_URI|g" $DEPLOY_FILE

          git config user.email "github-actions@ci.local"
          git config user.name "github-actions"

          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add $DEPLOY_FILE
            git commit -m "ci: bump image to $IMAGE_TAG"
            git push origin HEAD
          fi
